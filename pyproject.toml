[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ytd"
version = "0.1.0"
description = "Простой CLI-загрузчик видео с поддержкой площадок yt-dlp (YouTube, VK и др.)."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Ivan" }
]
license = { text = "MIT" }
keywords = ["youtube", "downloader", "yt-dlp", "cli", "video", "audio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

# Основные зависимости рантайма
dependencies = [
  "yt-dlp>=2026.3.17",
  "typer>=0.25.0",
  "rich>=15",
  "PyYAML>=6",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=9",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "types-PyYAML>=6",
]

[tool.coverage.run]
source = ["ytd"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
# Старт намеренно не строгий: цель — зелёный базовый уровень в CI, а не
# одномоментное переписывание аннотаций (BL-1203).
python_version = "3.14"
files = ["ytd"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Зависший тест должен падать с трассировкой, а не блокировать весь прогон (BL-1104).
# Полный прогон занимает ~40 с, поэтому 60 с на тест — с запасом.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B023", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E741"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
# Консольная команда `ytd`
ytd = "ytd.cli:main"

[project.urls]
Homepage = "https://github.com/kogriv/ytd"
