# Пример конфигурационного файла ytd
# Скопируйте его как ./ytd.config.yaml рядом с местом запуска ytd
# или задайте путь через переменную окружения YTD_CONFIG.
# Если хотите хранить файл в ~/.config/ytd/config.yaml или %APPDATA%\ytd\config.yaml,
# экспортируйте переменную окружения:
#   Linux/macOS: export YTD_CONFIG=~/.config/ytd/config.yaml
#   Windows PowerShell: $env:YTD_CONFIG = "$Env:APPDATA\\ytd\\config.yaml"

# Папка для сохранения загруженных файлов
output: downloads

# Качество видео (best, 1080p, 720p, audio)
quality: best

# Формат видео-контейнера (mp4, webm)
video_format: mp4

# Скачивать только аудио
audio_only: false

# Формат аудио (m4a, mp3, opus)
audio_format: m4a

# Шаблон имени файла (синтаксис yt-dlp)
name_template: "%(title)s [%(id)s].%(ext)s"

# Список языков субтитров для загрузки (например: [ru, en])
subtitles: []

# URL прокси-сервера (опционально)
# proxy: "http://proxy.example.com:8080"

# Cookies для обхода anti-bot (YouTube и др.)
# cookies_file: ./cookies.txt
# cookies_from_browser: firefox

# Количество попыток при ошибках
retry: 3

# Задержка между попытками (секунды)
retry_delay: 5.0

# Журнал загрузок
# Включить сохранение истории в SQLite
history_enabled: true
# Путь к файлу базы истории (SQLite)
history_db: data/history.db

# Построчный архив метаданных yt-dlp (JSONL). По умолчанию отключён:
# журнал ведётся в SQLite, а такой же дамп можно получить командой
#   ytd history export --format jsonl > meta.jsonl
# Задайте путь, если нужен автоматический файл для grep/jq. Если файл уже есть,
# он будет один раз импортирован в SQLite при первом создании базы.
# save_metadata: data/meta.jsonl

# === Управление паузами ===

# Включить возможность паузы между видео в плейлистах
# (можно переопределить через --pause-between в CLI)
pause_between_videos: false

# Клавиша для запроса паузы (нажать во время загрузки)
pause_key: p

# Клавиша для возобновления после паузы
resume_key: r

# Пауза внутри текущего файла (CLI: --intra-video-pause)
intra_video_pause: false

# Включить интерактивный выбор качества по умолчанию (можно переопределить --interactive / --no-interactive)
interactive_by_default: false

# Автоматически распознавать плейлисты по URL без флага --playlist
auto_detect_playlists: true

# Отключить progress bar yt-dlp (обход OSError [Errno 22] в Windows-консоли)
no_progress: false
