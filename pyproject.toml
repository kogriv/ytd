[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ytd"
version = "0.1.0"
description = "Простой CLI-загрузчик видео с поддержкой площадок yt-dlp (YouTube, VK и др.)."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Ivan" }
]
license = { text = "MIT" }
keywords = ["youtube", "downloader", "yt-dlp", "cli", "video", "audio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

# Основные зависимости рантайма
dependencies = [
  "yt-dlp>=2026.3.17",
  "typer>=0.25.0",
  "rich>=15",
  "PyYAML>=6",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B023", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E741"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
# Консольная команда `ytd`
ytd = "ytd.cli:main"

[project.urls]
Homepage = "https://github.com/kogriv/ytd"
